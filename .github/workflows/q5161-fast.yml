name: Q5161 fast exact computation

on:
  push:
    branches:
      - chatgpt-compute-q5161-public2
    paths:
      - compute/q5161_fast.py
      - .github/workflows/q5161-fast.yml
  pull_request:
    branches:
      - main
    paths:
      - compute/q5161_fast.py
      - .github/workflows/q5161-fast.yml

permissions:
  contents: write

jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy
      - run: python compute/q5161_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: q5161-fast-${{ matrix.os }}
          path: compute/q5161-fast-results.md
      - name: Commit result from macOS push build
        if: github.event_name == 'push' && matrix.os == 'macos-latest'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compute/q5161-fast-results.md
          git commit -m "Generate Q5161 fast exact report" || true
          git push
