name: Q5161 public exact computation

on:
  push:
    branches:
      - chatgpt-sagecell-q5161
    paths:
      - compute/q5161.sage
      - .github/workflows/q5161-compute.yml

permissions:
  contents: write

concurrency:
  group: q5161-public-compute
  cancel-in-progress: true

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Sage computation
        run: docker run --rm -v "$PWD:/work" -w /work sagemath/sagemath:latest sage compute/q5161.sage
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compute/q5161-results.md
          git commit -m "Generate Q5161 exact report" || true
          git push
