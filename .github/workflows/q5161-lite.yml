name: Q5161 lightweight exact computation

on:
  push:
    branches: [chatgpt-q5161-lite]
    paths: [compute/q5161_lite.py, .github/workflows/q5161-lite.yml]
  pull_request:
    branches: [main]
    paths: [compute/q5161_lite.py, .github/workflows/q5161-lite.yml]

permissions:
  contents: write

jobs:
  lite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-13]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python compute/q5161_lite.py
      - uses: actions/upload-artifact@v4
        with:
          name: q5161-lite-${{ matrix.os }}
          path: compute/q5161-lite-results.md
      - name: Commit result from macOS push build
        if: github.event_name == 'push' && matrix.os == 'macos-13'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compute/q5161-lite-results.md
          git commit -m "Generate Q5161 lite exact report" || true
          git push
